<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Reading Room — Library Catalog</title>

    <style>
        :root {
            --paper: #f3efe4;
            --ink: #23221d;
            --forest:#2f3e33;
            --forest:#1f2a22;
            --brass:#88874a;
            --brass-light:#e4c99a;
            --rust: #A8462F;
            --card-shadow: rgba(35, 34, 29, 0.14);

            --font-display: Georgia, serif;
            --font-body: Arial, sans-serif;
        }
        *{
            box-sizing: border-box;
        }
        body{
            margin: 0;
            background-color: var(--paper);
            color: var(--ink);
            font-family: var(--font-body);
            line-height:1.5;
        }
         .catalog-header {
            background-color: var(--forest);
            color: var(--paper);
            padding: 3rem 1.5rem 3.5rem;
            border-bottom: 6px solid var(--brass);
        }

        .header-inner {
            max-width: 760px;
            margin: 0 auto;
        }

        .drawer-label {
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            color: var(--brass-light);
            margin: 0 0 0.5rem;
        }

        .catalog-header h1 {
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            margin: 0 0 0.6rem;
        }

        .tagline{
            font-size: 1.05rem;
            color:var(--brass-light);
            margin: 0;
        }
        
        .catalog-main{
            max-width: 1000px;
            margin: -1.75rem auto 0;
            padding: 0 1.5rem 3rem;
        }
        .controls{
            background-color: white;
            border: 1px solid #e3dcc8;
            border-radius: 4px;
            padding: 1.25rem;
            box-shadow: 0 8px 20px var(--card-shadow);
        }
        #searchInput{
             width: 100%;
            padding: 0.75rem 0.9rem;
            font-size: 1rem;
            border: 1px solid #D8CFB8;
            border-radius: 3px;
            background-color: var(--paper);
            color: var(--ink);
        }
        #searchInput:focus{
            outline: 2px solid var(--brass);
        }
        .genre-chip{
             font-size: 0.85rem;
            padding: 0.35rem 0.85rem;
            border: 1px solid var(--forest);
            border-radius: 999px;
            background-color: transparent;
            color: var(--forest);
            cursor: pointer;
        }
        .genre-chip:hover,
        .genre-chip:active{
            background-color: var(--forest);
            color: var(--paper);
        }
        .result-count {
             font-size: 0.9rem;
            color: #6B6555;
            margin: 1.25rem 0 0.75rem;
        }
        .book-grid{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 1.1rem;
        }
        .book-card{
            background-color: white;
            border: 1px solid #E3DCC8;
            border-left: 5px solid var(--brass);
            border-radius: 3px;
            padding: 1.1rem 1.2rem;
            box-shadow: 0 4px 10px var(--card-shadow);
        }
        .book-card.checked-out {
            border-left-color: var(--rust);
        }
        .book-title {
             font-family: var(--font-display);
            font-size: 1.15rem;
            margin: 0;
            color: var(--forest-dark);
        }
        .book-author{
             font-size: 0.9rem;
            color: #55503F;
            margin: 0;
        }
        .book-meta{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
            font-size: 0.8rem;
        }
        .book-genre{
            color: var(--brass);
            font-weight: bold;
        }
        .book-status{
             padding: 0.15rem 0.6rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .book-status.available{
             background-color: #E4EEE5;
            color: var(--forest);
        }
         .book-status.checked-out {
            background-color: #F3E1DA;
            color: var(--rust);
        }

        .empty-state {
            text-align: center;
            color: #6B6555;
            padding: 2.5rem 1rem;
        }
        .catalog-footer{
            text-align: center;
            font-size: 0.85rem;
            color: #6B6555;
            padding: 1.5rem;
        }
        .catalog-footer code {
             background-color: #E9E2CF;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
        }
        @media (max-width: 480px){
            .catalog-header{
                padding: 2.25rem 1.25rem 2.75rem;
            }
        }
        
    </style>
    <link rel="preconnect" href="https//fonts.googleapis.com">
    <link href="https//fonts.googleapis.com/css2?family=Lora...
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="catalog-header">
    <div class="header-inner">
      <p class="drawer-label">Card Catalog</p>
      <h1>The Reading Room</h1>
      <p class="tagline">A running record of every book on the shelf.</p>
    </div>
  </header>

  <main class="catalog-main">

    <div class="controls">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by title or author…"
        autocomplete="off"
      >
      <div class="genre-filters" id="genreFilters">
      </div>
    </div>

    <p id="resultCount" class="result-count"></p>

    <section id="bookGrid" class="book-grid"></section>

    <p id="emptyState" class="empty-state"hidden>
        No books match that search. Try a different title or author.
    </p>

    </main>
    
    <footer class="catalog-footer">
        <p> library Catalog </p>
    </footer>

<div id="bookGrid"></div>
<footer class="catalog-footer">
    <p>Library Catalog</p>
</footer>
<script src="script.js"></script>
    </body>
    </html>
