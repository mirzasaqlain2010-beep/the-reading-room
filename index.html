<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Reading Room — Library Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="catalog-header">
        <div class="header-inner">
            <p class="drawer-label">Card Catalog</p>
            <h1>The Reading Room</h1>
            <p class="tagline">
                A running record of every book on the shelf.
            </p>
        </div>
    </header>

    <main class="catalog-main">

        <div class="controls">
            <input
                type="text"
                id="searchInput"
                placeholder="Search by title or author..."
                autocomplete="off"
            >

            <div class="genre-filters" id="genreFilters"></div>
        </div>

        <p id="resultCount" class="result-count"></p>

        <section id="bookGrid" class="book-grid"></section>

        <p id="emptyState" class="empty-state" hidden>
            No books match that search.
            Try a different title or author.
        </p>

    </main>

    <footer class="catalog-footer">
        <p>Library Catalog</p>
    </footer>

    <script src="/script.js"></script>

</body>
</html>
